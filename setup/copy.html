<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서버 코드 복사</title>
<meta name="robots" content="noindex"><style>body{font:15px system-ui,sans-serif;margin:16px}button{font-size:20px;padding:14px 28px;background:#111;color:#fff;border:0;border-radius:10px}textarea{width:100%;height:60vh;font:12px monospace}</style></head>
<body><button id="copy">서버 코드 복사</button> <span id="st"></span><p></p><textarea id="code" readonly>/**
 * EEUN 상품 등록 앱 (Google Apps Script 웹앱)
 * 텍스트 + 사진 → GPT 분석 → 제품컷 생성 → 상세페이지·사이즈표 → 드라이브 업로드 → 샘플시트·작지 기록
 *
 * 스크립트 속성 (프로젝트 설정 &gt; 스크립트 속성)
 *   OPENAI_API_KEY  (필수)  OpenAI API 키
 *   APP_PASSCODE    (권장)  앱 접속 비밀번호
 *   TEXT_MODEL      (선택)  기본 gpt-4.1
 *   IMAGE_MODEL     (선택)  기본 gpt-image-1
 *   IMAGE_QUALITY   (선택)  low | medium | high, 기본 medium
 *   FX_CNY_KRW      (선택)  환율 자동조회 실패 시 사용할 값
 */

var CFG = {
  SHEET_ID: &#x27;1olJ4HFFMF308F1jATmD-jBxpOXYjUHnaNcui4AaNfTA&#x27;, // 샘플관리
  SAMPLE_TAB: &#x27;샘플&#x27;,
  CALC_TAB: &#x27;판매가 계산기&#x27;,
  EEUN_ROOT: &#x27;1jVoc9FnT4dlPp-ar2ycVpOADDR2nfu30&#x27;,           // 이은 제품 폴더
  JAKJI_SHEET_ID: &#x27;10q6CJttcafXTCJjpkcCiV9nGSCN3QT0fl3kP5Kmbvlw&#x27;, // EEUN · COVETT 작업지시서 (상품·라벨 4탭)
  JAKJI_TAB: &#x27;EEUN 상품목록&#x27;,
  LOGO_STAR_ID: &#x27;1URa8kzo8R5z9W2Cb8kcCO5IK9xHydXVb&#x27;,
  LOGO_ARCHIVE_ID: &#x27;1OCedQbW5ACCApJ5usLIL3B2Qaf4C9kzX&#x27;,
  TZ: &#x27;Asia/Seoul&#x27;
};

/* ───────────────────────── 기본 ───────────────────────── */

/** 앱(PWA)이 호출하는 API. 본문: {&quot;fn&quot;:&quot;api_init&quot;,&quot;args&quot;:[...]} */
var API = {
  api_status: api_status, api_setup: api_setup,
  api_init: api_init, api_analyze: api_analyze, api_generateCut: api_generateCut,
  api_prepareFolders: api_prepareFolders, api_uploadFile: api_uploadFile, api_finalize: api_finalize
};

/** 처음 설정 여부 (비밀번호·키 값은 돌려주지 않음) */
function api_status() {
  return { hasPass: !!prop_(&#x27;APP_PASSCODE&#x27;, &#x27;&#x27;), hasKey: !!prop_(&#x27;OPENAI_API_KEY&#x27;, &#x27;&#x27;) };
}

/** 폰 앱에서 비밀번호(처음 1회)와 GPT 키를 저장. 키는 이 서버의 스크립트 속성에만 저장됨 */
function api_setup(code, apiKey) {
  var lock = LockService.getScriptLock(); lock.waitLock(10000);
  try {
    var props = PropertiesService.getScriptProperties();
    var pass = prop_(&#x27;APP_PASSCODE&#x27;, &#x27;&#x27;);
    code = String(code || &#x27;&#x27;).trim();
    if (!pass) {
      if (code.length &lt; 4) throw new Error(&#x27;비밀번호는 4자 이상으로 정해주세요.&#x27;);
      props.setProperty(&#x27;APP_PASSCODE&#x27;, code);
    } else if (code !== pass) {
      throw new Error(&#x27;비밀번호가 맞지 않아요.&#x27;);
    }
    if (apiKey) {
      apiKey = String(apiKey).trim();
      var r = UrlFetchApp.fetch(&#x27;https://api.openai.com/v1/models&#x27;, { headers: { Authorization: &#x27;Bearer &#x27; + apiKey }, muteHttpExceptions: true });
      if (r.getResponseCode() !== 200) throw new Error(&#x27;GPT 키 확인 실패 (&#x27; + r.getResponseCode() + &#x27;). 키를 다시 확인해주세요.&#x27;);
      props.setProperty(&#x27;OPENAI_API_KEY&#x27;, apiKey);
    }
    return api_status();
  } finally { lock.releaseLock(); }
}

function doPost(e) {
  var out;
  try {
    var req = JSON.parse(e.postData.contents);
    var f = API[req.fn];
    if (!f) throw new Error(&#x27;알 수 없는 요청: &#x27; + req.fn);
    out = { ok: true, result: f.apply(null, req.args || []) };
  } catch (err) {
    out = { ok: false, error: String(err &amp;&amp; err.message || err) };
  }
  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);
}

/** 주소를 브라우저로 열면: Index 화면이 있으면 그 화면, 없으면 서버 상태 표시 */
function doGet() {
  try {
    return HtmlService.createHtmlOutputFromFile(&#x27;Index&#x27;)
      .setTitle(&#x27;EEUN 상품 등록&#x27;)
      .addMetaTag(&#x27;viewport&#x27;, &#x27;width=device-width, initial-scale=1, maximum-scale=1&#x27;);
  } catch (e) {
    return ContentService.createTextOutput(&#x27;EEUN 상품등록 서버 작동 중 · 이 주소를 앱의 &quot;서버 주소&quot;에 넣어주세요.&#x27;);
  }
}

function prop_(k, d) {
  var v = PropertiesService.getScriptProperties().getProperty(k);
  return (v === null || v === &#x27;&#x27;) ? d : v;
}

function auth_(code) {
  var pass = prop_(&#x27;APP_PASSCODE&#x27;, &#x27;&#x27;);
  if (pass &amp;&amp; String(code || &#x27;&#x27;) !== pass) throw new Error(&#x27;비밀번호가 맞지 않아요.&#x27;);
  if (!prop_(&#x27;OPENAI_API_KEY&#x27;, &#x27;&#x27;)) throw new Error(&#x27;스크립트 속성에 OPENAI_API_KEY가 없어요.&#x27;);
}

function dataUrl_(fileId) {
  var b = DriveApp.getFileById(fileId).getBlob();
  return &#x27;data:&#x27; + b.getContentType() + &#x27;;base64,&#x27; + Utilities.base64Encode(b.getBytes());
}

/* ───────────────────────── 초기 정보 ───────────────────────── */

function api_init(code) {
  auth_(code);
  return {
    logos: { star: dataUrl_(CFG.LOGO_STAR_ID), archive: dataUrl_(CFG.LOGO_ARCHIVE_ID) },
    calc: readCalc_(),
    fx: getFx_(),
    week: weekInfo_(new Date()),
    recentNames: recentNames_(80),
    models: { text: prop_(&#x27;TEXT_MODEL&#x27;, &#x27;gpt-4.1&#x27;), image: prop_(&#x27;IMAGE_MODEL&#x27;, &#x27;gpt-image-1&#x27;) }
  };
}

/** 판매가 계산기 탭에서 물류비·수수료·배율을 읽는다 (수식이 바뀌어도 따라가도록) */
function readCalc_() {
  var sh = SpreadsheetApp.openById(CFG.SHEET_ID).getSheetByName(CFG.CALC_TAB);
  var mult = function (a1, d) {
    var f = sh.getRange(a1).getFormula() || &#x27;&#x27;;
    var m = f.match(/\(\s*([\d.]+)\s*\*/);
    return m ? Number(m[1]) : d;
  };
  return {
    ddm: { logistics: Number(sh.getRange(&#x27;C5&#x27;).getValue()) || 5000, fee: Number(sh.getRange(&#x27;C6&#x27;).getValue()) || 0.12, mult: mult(&#x27;C7&#x27;, 2.5) },
    cn:  { logistics: Number(sh.getRange(&#x27;C15&#x27;).getValue()) || 5000, fee: Number(sh.getRange(&#x27;C16&#x27;).getValue()) || 0.12, mult: mult(&#x27;C17&#x27;, 3.5) }
  };
}

function getFx_() {
  var cache = CacheService.getScriptCache();
  var c = cache.get(&#x27;fx_cny_krw&#x27;);
  if (c) return JSON.parse(c);
  var out = null;
  try {
    var r = UrlFetchApp.fetch(&#x27;https://open.er-api.com/v6/latest/CNY&#x27;, { muteHttpExceptions: true });
    if (r.getResponseCode() === 200) {
      var j = JSON.parse(r.getContentText());
      if (j &amp;&amp; j.rates &amp;&amp; j.rates.KRW) out = { rate: Math.round(j.rates.KRW * 100) / 100, source: &#x27;open.er-api.com&#x27;, date: Utilities.formatDate(new Date(), CFG.TZ, &#x27;yyyy-MM-dd&#x27;) };
    }
  } catch (e) {}
  if (!out) out = { rate: Number(prop_(&#x27;FX_CNY_KRW&#x27;, 200)), source: &#x27;스크립트 속성 FX_CNY_KRW (자동조회 실패)&#x27;, date: Utilities.formatDate(new Date(), CFG.TZ, &#x27;yyyy-MM-dd&#x27;) };
  cache.put(&#x27;fx_cny_krw&#x27;, JSON.stringify(out), 3 * 3600);
  return out;
}

/** 월~일 주, 목요일이 속한 달 기준 주차 (&quot;2026년 11월 2주차 신규 (11.09–11.15)&quot;) */
function weekInfo_(date) {
  var p = Utilities.formatDate(date, CFG.TZ, &#x27;yyyy-MM-dd&#x27;).split(&#x27;-&#x27;).map(Number);
  var d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
  var dow = d.getUTCDay();                 // 0=일
  var monday = new Date(d.getTime() - ((dow + 6) % 7) * 86400000);
  var sunday = new Date(monday.getTime() + 6 * 86400000);
  var thursday = new Date(monday.getTime() + 3 * 86400000);
  var wk = Math.floor((thursday.getUTCDate() - 1) / 7) + 1;
  var pad = function (n) { return (n &lt; 10 ? &#x27;0&#x27; : &#x27;&#x27;) + n; };
  var name = thursday.getUTCFullYear() + &#x27;년 &#x27; + (thursday.getUTCMonth() + 1) + &#x27;월 &#x27; + wk + &#x27;주차 신규 (&#x27; +
    pad(monday.getUTCMonth() + 1) + &#x27;.&#x27; + pad(monday.getUTCDate()) + &#x27;–&#x27; + pad(sunday.getUTCMonth() + 1) + &#x27;.&#x27; + pad(sunday.getUTCDate()) + &#x27;)&#x27;;
  return { name: name, today: Utilities.formatDate(date, CFG.TZ, &#x27;yyyy-MM-dd&#x27;) };
}

function recentNames_(n) {
  var sh = SpreadsheetApp.openById(CFG.SHEET_ID).getSheetByName(CFG.SAMPLE_TAB);
  var last = lastRowInCol_(sh, 4);
  if (last &lt; 2) return [];
  var start = Math.max(2, last - n + 1);
  return sh.getRange(start, 4, last - start + 1, 1).getDisplayValues().map(function (r) { return r[0]; }).filter(String);
}

function lastRowInCol_(sh, col) {
  var vals = sh.getRange(1, col, sh.getLastRow(), 1).getDisplayValues();
  for (var i = vals.length - 1; i &gt;= 0; i--) if (String(vals[i][0]).trim() !== &#x27;&#x27;) return i + 1;
  return 0;
}

/* ───────────────────────── OpenAI ───────────────────────── */

function openaiJson_(messages) {
  var res = UrlFetchApp.fetch(&#x27;https://api.openai.com/v1/chat/completions&#x27;, {
    method: &#x27;post&#x27;,
    contentType: &#x27;application/json&#x27;,
    headers: { Authorization: &#x27;Bearer &#x27; + prop_(&#x27;OPENAI_API_KEY&#x27;, &#x27;&#x27;) },
    payload: JSON.stringify({ model: prop_(&#x27;TEXT_MODEL&#x27;, &#x27;gpt-4.1&#x27;), messages: messages, response_format: { type: &#x27;json_object&#x27; } }),
    muteHttpExceptions: true
  });
  var body = res.getContentText();
  if (res.getResponseCode() !== 200) throw new Error(&#x27;GPT 분석 오류 (&#x27; + res.getResponseCode() + &#x27;): &#x27; + body.slice(0, 400));
  var txt = JSON.parse(body).choices[0].message.content;
  return JSON.parse(txt);
}

var ANALYZE_SYSTEM = [
  &#x27;너는 한국 여성의류 쇼핑몰 EEUN(이은)의 신상품 등록 담당자다. 사용자가 보낸 메시지와 1688/동대문 캡처·제품 사진을 읽고 상품 등록 정보를 JSON으로만 답한다.&#x27;,
  &#x27;규칙:&#x27;,
  &#x27;1. 사용자가 지정한 판매 컬러만 sale_colors에 넣는다. 공급처에 다른 컬러가 있어도 넣지 않는다. 사용자가 부르는 이름을 그대로 쓴다(예: 공급처 짙은 녹색 → 사용자 &quot;카키&quot;).&#x27;,
  &#x27;2. 공급처 발주 옵션(컬러/사이즈)과 판매 옵션을 분리한다. 예: 공급처 M으로 발주, 판매는 FREE.&#x27;,
  &#x27;3. 실측은 캡처·텍스트에서 확인된 숫자만, 발주 사이즈 기준, 단면 cm로 적는다. 胸围·腰围·臀围처럼 둘레값이면 ÷2 해서 단면으로 바꾸고 measurement_note에 원래 값을 기록한다. 衣长=총장, 肩宽=어깨, 袖长=소매, 胸围=가슴. 추측 금지. 없으면 빈 배열.&#x27;,
  &#x27;4. 가격은 캡처에 보이는 발주 옵션 단가(위안 또는 원)를 price.amount에. 공급처 배송비는 price.shipping. 사용자가 판매가를 직접 말하면 user_sale_price에.&#x27;,
  &#x27;5. 상품명(product_name)은 EEUN 스타일: 지어낸 2~3음절 이름 + 핵심 디테일 1~3개 + 아이템명, 한글만. 예) 레벤 하이넥 더블 버튼 자켓, 로웬 토글 후드 퍼 자켓, 벨린 퍼트림 스웨이드 숏 무스탕. recent_names와 겹치지 않게.&#x27;,
  &#x27;6. 사용자가 EEUN 로고·라벨·프레스·금형을 실제 제품에 달라고 지시하면 made=true, labels에 지시를 정리하고 상품명 앞에 &quot;[ EEUN MADE ] &quot;를 붙인다. 페이지 장식용 로고는 해당 없음.&#x27;,
  &#x27;7. features는 사진에서 실제 보이는 디자인 특징만 3~4개, &quot;- &quot; 없이 짧은 한국어. description은 고객용 2문장.&#x27;,
  &#x27;8. ghost_prompt는 이미지 생성용 영어 설명: 원단·색·실루엣·기장·카라·여밈·포켓·소매·밑단·장식 디테일을 빠짐없이 구체적으로.&#x27;,
  &#x27;9. product_ref_indices: 제품 형태가 가장 잘 보이는 사진 번호(0부터) 최대 4개 (마네킹·착용 사진 우선, 사이즈표·옵션 캡처 제외).&#x27;,
  &#x27;10. detail_crops: 클로즈업에 쓸 영역 3개. 각 {image_index, label, box:[x0,y0,x1,y1]} box는 0~1 정규화 좌표, 가로:세로 약 0.9:1, 얼굴·텍스트·앱 UI 제외, 실제 디테일(카라, 지퍼, 포켓, 소매, 밑단, 단추 등)이 크게 보이게.&#x27;,
  &#x27;11. 소재는 확인된 표기만. 혼용률이 없으면 material_internal에 &quot;혼용률 미기재&quot;. material_customer는 고객용 짧은 표기.&#x27;,
  &#x27;출력 JSON 키: product_name, product_name_en, type(&quot;1688&quot;|&quot;동대문&quot;), supplier{name,product_title,url,item_no,location,contact}, price{currency(&quot;CNY&quot;|&quot;KRW&quot;),amount,shipping,evidence}, user_sale_price(숫자 또는 null), supplier_option{color,size,note}, sale_colors[{name,en,hex}], sale_size, measurements[{label,value}], measurement_note, material_customer, material_internal, features[], description, category, made, labels[{label,position,memo}], ghost_prompt, product_ref_indices[], detail_crops[], unknowns[]&#x27;
].join(&#x27;\n&#x27;);

/**
 * @param {string} text 사용자 메시지
 * @param {Array&lt;{mime:string,b64:string}&gt;} images
 */
function api_analyze(code, text, images) {
  auth_(code);
  var content = [{ type: &#x27;text&#x27;, text: &#x27;사용자 메시지:\n&#x27; + text + &#x27;\n\nrecent_names: &#x27; + JSON.stringify(recentNames_(80)) + &#x27;\n\n첨부 이미지 &#x27; + images.length + &#x27;장 (0번부터 순서대로)&#x27; }];
  images.forEach(function (im, i) {
    content.push({ type: &#x27;text&#x27;, text: &#x27;이미지 &#x27; + i });
    content.push({ type: &#x27;image_url&#x27;, image_url: { url: &#x27;data:&#x27; + im.mime + &#x27;;base64,&#x27; + im.b64, detail: &#x27;high&#x27; } });
  });
  return openaiJson_([{ role: &#x27;system&#x27;, content: ANALYZE_SYSTEM }, { role: &#x27;user&#x27;, content: content }]);
}

/** 고스트 마네킹 제품컷 1장 생성 (배경 투명) */
function api_generateCut(code, req) {
  auth_(code);
  var view = req.view === &#x27;side&#x27;
    ? &#x27;three-quarter side view (about 45 degrees), showing the side seam, sleeve and silhouette&#x27;
    : &#x27;straight front view&#x27;;
  var prompt = [
    &#x27;Create a professional e-commerce ghost-mannequin (invisible mannequin) product photo of the exact garment shown in the reference images.&#x27;,
    &#x27;View: &#x27; + view + &#x27;.&#x27;,
    &#x27;Garment color: &#x27; + req.colorEn + (req.hex ? &#x27; (&#x27; + req.hex + &#x27;)&#x27; : &#x27;&#x27;) + &#x27;.&#x27;,
    &#x27;Garment details to reproduce exactly: &#x27; + req.hint,
    &#x27;Keep every construction detail identical to the references (collar, closure, pockets, seams, cuffs, hem, trims, hardware). Do not invent logos, text, labels or extra decorations.&#x27;,
    &#x27;Remove the person, mannequin, stand, hanger and tags. Show the inside back neckline for the hollow ghost effect.&#x27;,
    &#x27;Garment centered and fully visible with generous margin, natural drape, soft even studio light, transparent background, no props, no text.&#x27;
  ].join(&#x27; &#x27;);
  var model = prop_(&#x27;IMAGE_MODEL&#x27;, &#x27;gpt-image-1&#x27;);
  var fields = {
    model: model,
    prompt: prompt,
    size: &#x27;1024x1536&#x27;,
    quality: prop_(&#x27;IMAGE_QUALITY&#x27;, &#x27;medium&#x27;),
    background: &#x27;transparent&#x27;,
    output_format: &#x27;png&#x27;,
    input_fidelity: &#x27;high&#x27;,
    n: &#x27;1&#x27;
  };
  var files = (req.refs || []).slice(0, 4).map(function (r, i) {
    return { name: &#x27;image[]&#x27;, filename: &#x27;ref&#x27; + i + &#x27;.jpg&#x27;, mime: r.mime, bytes: Utilities.base64Decode(r.b64) };
  });
  var res = postMultipart_(&#x27;https://api.openai.com/v1/images/edits&#x27;, fields, files);
  if (res.code === 400 &amp;&amp; /input_fidelity/.test(res.body)) {
    delete fields.input_fidelity;
    res = postMultipart_(&#x27;https://api.openai.com/v1/images/edits&#x27;, fields, files);
  }
  if (res.code !== 200) throw new Error(&#x27;제품컷 생성 오류 (&#x27; + res.code + &#x27;): &#x27; + res.body.slice(0, 400));
  var j = JSON.parse(res.body);
  return { mime: &#x27;image/png&#x27;, b64: j.data[0].b64_json };
}

function postMultipart_(url, fields, files) {
  var boundary = &#x27;----eeun&#x27; + Utilities.getUuid().replace(/-/g, &#x27;&#x27;);
  var bytes = [];
  var add = function (s) { bytes = bytes.concat(Utilities.newBlob(s).getBytes()); };
  Object.keys(fields).forEach(function (k) {
    add(&#x27;--&#x27; + boundary + &#x27;\r\nContent-Disposition: form-data; name=&quot;&#x27; + k + &#x27;&quot;\r\n\r\n&#x27; + fields[k] + &#x27;\r\n&#x27;);
  });
  files.forEach(function (f) {
    add(&#x27;--&#x27; + boundary + &#x27;\r\nContent-Disposition: form-data; name=&quot;&#x27; + f.name + &#x27;&quot;; filename=&quot;&#x27; + f.filename + &#x27;&quot;\r\nContent-Type: &#x27; + f.mime + &#x27;\r\n\r\n&#x27;);
    bytes = bytes.concat(f.bytes);
    add(&#x27;\r\n&#x27;);
  });
  add(&#x27;--&#x27; + boundary + &#x27;--\r\n&#x27;);
  var r = UrlFetchApp.fetch(url, {
    method: &#x27;post&#x27;,
    contentType: &#x27;multipart/form-data; boundary=&#x27; + boundary,
    headers: { Authorization: &#x27;Bearer &#x27; + prop_(&#x27;OPENAI_API_KEY&#x27;, &#x27;&#x27;) },
    payload: bytes,
    muteHttpExceptions: true
  });
  return { code: r.getResponseCode(), body: r.getContentText() };
}

/* ───────────────────────── 가격 ───────────────────────── */

/** 판매가 계산기와 같은 식 */
function computePrice_(type, cost, calc, userPrice) {
  var c = type === &#x27;동대문&#x27; ? calc.ddm : calc.cn;
  var price = userPrice ? Number(userPrice) : Math.ceil((c.mult * cost + c.logistics) / (1 - c.fee) / 1000) * 1000;
  var profit = Math.round(price * (1 - c.fee) - c.logistics - cost);
  var maxDisc = type === &#x27;동대문&#x27;
    ? 1 - (price * c.fee + c.logistics + cost) / price
    : 1 - (price * c.fee + c.logistics + 2 * cost) / price;
  return {
    price: price, profit: profit, maxDisc: maxDisc, mult: c.mult, logistics: c.logistics, fee: c.fee,
    basis: userPrice ? &#x27;사용자 지정&#x27; : (&#x27;EEUN &#x27; + (type === &#x27;동대문&#x27; ? &#x27;동대문&#x27; : &#x27;중국 사입&#x27;) + &#x27; 계산식&#x27;),
    formula: userPrice ? &#x27;사용자 지정 판매가&#x27; :
      &#x27;ROUNDUP((&#x27; + fmt_(cost) + &#x27; × &#x27; + c.mult + &#x27; + &#x27; + fmt_(c.logistics) + &#x27;) ÷ (1 − &#x27; + Math.round(c.fee * 100) + &#x27;%), -3) = &#x27; + fmt_(price) + &#x27;원&#x27;
  };
}

function fmt_(n) { return Number(n).toLocaleString(&#x27;ko-KR&#x27;); }

/* ───────────────────────── 드라이브 ───────────────────────── */

function folderIn_(parent, name) {
  var it = parent.getFoldersByName(name);
  return it.hasNext() ? it.next() : parent.createFolder(name);
}

function api_prepareFolders(code, productName) {
  auth_(code);
  var root = DriveApp.getFolderById(CFG.EEUN_ROOT);
  var week = folderIn_(root, weekInfo_(new Date()).name);
  var prod = folderIn_(week, productName);
  var shots = folderIn_(prod, &#x27;제품샷&#x27;);
  var src = folderIn_(prod, &#x27;99_공급처자료&#x27;);
  return { weekName: week.getName(), weekId: week.getId(), productId: prod.getId(), productUrl: prod.getUrl(), shotsId: shots.getId(), srcId: src.getId() };
}

/** 같은 이름 파일이 있으면 휴지통으로 보내고(복구 가능) 새로 올린다 */
function api_uploadFile(code, folderId, name, mime, b64) {
  auth_(code);
  var folder = DriveApp.getFolderById(folderId);
  var old = folder.getFilesByName(name);
  while (old.hasNext()) old.next().setTrashed(true);
  var f = folder.createFile(Utilities.newBlob(Utilities.base64Decode(b64), mime, name));
  return { id: f.getId(), url: f.getUrl() };
}

/* ───────────────────────── 기록 ───────────────────────── */

/**
 * d: { info(분석·수정된 상품정보), cost:{currency,amount,shipping,fx,fxSource,fxDate,krw},
 *      folders:{productId,productUrl,weekName}, files:{detailUrl,...}, addJakji:boolean }
 */
function api_finalize(code, d) {
  auth_(code);
  var calc = readCalc_();
  var info = d.info;
  if (d.cost.currency === &#x27;CNY&#x27;) d.cost.krw = Math.round(Number(d.cost.amount) * Number(d.cost.fx));
  else d.cost.krw = Math.round(Number(d.cost.amount));
  var pr = computePrice_(info.type, d.cost.krw, calc, info.user_sale_price);
  var txt = buildInfoTxt_(d, pr);
  var folder = DriveApp.getFolderById(d.folders.productId);
  var old = folder.getFilesByName(&#x27;상품정보.txt&#x27;);
  while (old.hasNext()) old.next().setTrashed(true);
  var txtFile = folder.createFile(Utilities.newBlob(txt, &#x27;text/plain&#x27;, &#x27;상품정보.txt&#x27;));
  var row = writeSampleRow_(d, pr, txtFile.getUrl());
  var jakji = (d.addJakji || info.made) ? writeJakji_(d) : null;
  return { row: row, txtUrl: txtFile.getUrl(), price: pr, jakjiRow: jakji };
}

function colorsKo_(info) { return (info.sale_colors || []).map(function (c) { return c.name; }).join(&#x27; / &#x27;); }
function sizeLine_(info) {
  return (info.measurements || []).map(function (m) { return m.label + &#x27; &#x27; + m.value; }).join(&#x27; / &#x27;);
}

function buildInfoTxt_(d, pr) {
  var i = d.info, c = d.cost, s = i.supplier || {}, so = i.supplier_option || {};
  var L = [];
  L.push(i.product_name);

  if (c.currency === &#x27;CNY&#x27;) {
    L.push(&#x27;원가(매입가): &#x27; + fmt_(c.krw) + &#x27;원 = &#x27; + c.amount + &#x27;위안 × &#x27; + c.fx + &#x27;원&#x27;);
    L.push(&#x27;환율: &#x27; + c.fxSource + &#x27; (&#x27; + c.fxDate + &#x27; 조회, 실제 결제액 아님)&#x27;);
  } else {
    L.push(&#x27;원가(매입가): &#x27; + fmt_(c.krw) + &#x27;원&#x27;);
  }
  L.push(&#x27;계산식: &#x27; + pr.formula);
  L.push(&#x27;적용 기준: 샘플관리 \&#x27;판매가 계산기\&#x27; &#x27; + pr.basis + &#x27; (배율 &#x27; + pr.mult + &#x27; / 물류비 &#x27; + fmt_(pr.logistics) + &#x27;원 / 수수료 &#x27; + Math.round(pr.fee * 100) + &#x27;%)&#x27;);
  L.push(&#x27;예상 순수익: &#x27; + fmt_(pr.profit) + &#x27;원&#x27;);
  L.push(&#x27;최대 가능 할인율: 약 &#x27; + Math.round(pr.maxDisc * 100) + &#x27;%&#x27;);
  if (c.shipping) L.push(&#x27;공급처 내 배송비 &#x27; + (c.currency === &#x27;CNY&#x27; ? &#x27;¥&#x27; : &#x27;&#x27;) + c.shipping + &#x27; 별도 (원가 미포함)&#x27;);
  L.push(&#x27;&#x27;);
  L.push(&#x27;[고객용 상품정보]&#x27;);
  L.push(&#x27;소재: &#x27; + (i.material_customer || &#x27;-&#x27;));
  L.push(&#x27;컬러: &#x27; + colorsKo_(i));
  L.push(&#x27;사이즈: &#x27; + (i.sale_size || &#x27;FREE&#x27;));
  L.push(&#x27;실측 (단면, cm): &#x27; + (sizeLine_(i) || &#x27;상세 실측은 확인 후 안내 예정입니다.&#x27;));
  L.push(&#x27;측정 방법에 따라 1~2cm의 오차가 있을 수 있습니다.&#x27;);
  L.push(&#x27;&#x27;);
  L.push(i.description || &#x27;&#x27;);
  (i.features || []).forEach(function (f) { L.push(&#x27;- &#x27; + f); });
  L.push(&#x27;&#x27;);
  L.push(&#x27;[내부 관리정보]&#x27;);
  L.push(&#x27;브랜드: EEUN&#x27; + (i.made ? &#x27; MADE&#x27; : &#x27;&#x27;));
  L.push(&#x27;유형: &#x27; + i.type);
  L.push(&#x27;공급처: &#x27; + (s.name || &#x27;미확인&#x27;) + (s.location ? &#x27; / &#x27; + s.location : &#x27;&#x27;) + (s.item_no ? &#x27; / 품번 &#x27; + s.item_no : &#x27;&#x27;));
  L.push(&#x27;공급처 상품명: &#x27; + (s.product_title || &#x27;미확인&#x27;));
  L.push(&#x27;공급처 링크: &#x27; + (s.url || &#x27;미제공&#x27;));
  L.push(&#x27;공급처 발주 옵션: &#x27; + [so.color, so.size].filter(String).join(&#x27; / &#x27;) + (so.note ? &#x27; (&#x27; + so.note + &#x27;)&#x27; : &#x27;&#x27;));
  L.push(&#x27;판매 옵션: &#x27; + (i.sale_colors || []).map(function (x) { return x.name + &#x27; / &#x27; + (i.sale_size || &#x27;FREE&#x27;); }).join(&#x27;, &#x27;));
  L.push(&#x27;공급처 소재 표기: &#x27; + (i.material_internal || &#x27;미확인&#x27;));
  if (i.measurement_note) L.push(&#x27;실측 메모: &#x27; + i.measurement_note);
  if (i.made &amp;&amp; (i.labels || []).length) L.push(&#x27;라벨·로고 지시: &#x27; + i.labels.map(function (l) { return [l.label, l.position, l.memo].filter(String).join(&#x27; / &#x27;); }).join(&#x27; | &#x27;));
  if ((i.unknowns || []).length) L.push(&#x27;미확인: &#x27; + i.unknowns.join(&#x27;, &#x27;));
  L.push(&#x27;&#x27;);
  L.push(&#x27;[제작 파일]&#x27;);
  L.push(&#x27;제품 폴더: &#x27; + d.folders.productUrl);
  L.push(&#x27;상위: 상세페이지 JPG / 상품정보 TXT · 제품샷 폴더: 컬러별 정면·사선 / 디테일 / 사이즈표&#x27;);
  L.push(&#x27;제품컷: 첨부 사진을 참고한 AI 생성 이미지 (&#x27; + prop_(&#x27;IMAGE_MODEL&#x27;, &#x27;gpt-image-1&#x27;) + &#x27;), 디테일은 첨부 사진 크롭&#x27;);
  L.push(&#x27;생성: EEUN 상품등록 앱&#x27;);
  L.push(&#x27;발주 및 판매채널 등록: 미진행&#x27;);
  return L.join(&#x27;\n&#x27;);
}

function writeSampleRow_(d, pr, txtUrl) {
  var ss = SpreadsheetApp.openById(CFG.SHEET_ID);
  var sh = ss.getSheetByName(CFG.SAMPLE_TAB);
  var i = d.info, s = i.supplier || {}, so = i.supplier_option || {};
  // 같은 상품명이 있으면 그 행을 갱신, 없으면 D열 마지막 다음 행
  var lastD = lastRowInCol_(sh, 4);
  var names = lastD ? sh.getRange(1, 4, lastD, 1).getDisplayValues() : [];
  var row = 0;
  for (var k = names.length - 1; k &gt;= 1; k--) if (names[k][0] === i.product_name) { row = k + 1; break; }
  if (!row) row = lastD + 1;
  var cur = sh.getRange(row, 1, 1, 28).getValues()[0];
  var url = d.folders.productUrl;
  var cnCalc = &quot;&#x27;&quot; + CFG.CALC_TAB + &quot;&#x27;&quot;;
  var jFormula = i.user_sale_price ? Number(i.user_sale_price) : (i.type === &#x27;동대문&#x27;
    ? &#x27;=ROUNDUP((&#x27; + pr.mult + &#x27;*K&#x27; + row + &#x27;+&#x27; + cnCalc + &#x27;!$C$5)/(1-&#x27; + cnCalc + &#x27;!$C$6),-3)&#x27;
    : &#x27;=ROUNDUP((&#x27; + pr.mult + &#x27;*K&#x27; + row + &#x27;+&#x27; + cnCalc + &#x27;!$C$15)/(1-&#x27; + cnCalc + &#x27;!$C$16),-3)&#x27;);
  var colorsEn = (i.sale_colors || []).map(function (c) { return (c.en || c.name).toUpperCase(); }).join(&#x27; / &#x27;);
  var desc = (i.description || &#x27;&#x27;) + (colorsEn ? &#x27;\nCOLOR: &#x27; + colorsEn : &#x27;&#x27;);
  var c = d.cost;
  var memo = [
    weekInfo_(new Date()).today + &#x27; EEUN 신규 (앱 등록) / &#x27; + i.product_name,
    colorsKo_(i) + &#x27; / 공급처 &#x27; + [so.color, so.size].filter(String).join(&#x27;·&#x27;) + &#x27; → 판매 &#x27; + (i.sale_size || &#x27;FREE&#x27;),
    (c.currency === &#x27;CNY&#x27; ? &#x27;사입가 &#x27; + c.amount + &#x27;위안 × &#x27; + c.fx + &#x27; = &#x27; + fmt_(c.krw) + &#x27;원&#x27; : &#x27;사입가 &#x27; + fmt_(c.krw) + &#x27;원&#x27;) + &#x27; / 판매가 &#x27; + fmt_(pr.price) + &#x27;원&#x27;,
    i.measurement_note || &#x27;&#x27;,
    &#x27;상위: 상세페이지·상품정보 TXT / 제품샷: 제품컷·디테일·사이즈표. 발주·판매채널 등록 미진행.&#x27;
  ].filter(String).join(&#x27;\n&#x27;);
  var vals = cur.slice();
  vals[0] = i.type === &#x27;동대문&#x27; ? &#x27;동대문&#x27; : 1688;
  vals[1] = s.name || &#x27;&#x27;;
  vals[2] = s.url || &#x27;&#x27;;
  vals[3] = &#x27;=HYPERLINK(&quot;&#x27; + url + &#x27;&quot;,&quot;&#x27; + i.product_name.replace(/&quot;/g, &#x27;&quot;&quot;&#x27;) + &#x27;&quot;)&#x27;;
  vals[4] = s.product_title || &#x27;&#x27;;
  vals[5] = i.material_internal || i.material_customer || &#x27;&#x27;;
  vals[6] = (i.sale_size || &#x27;FREE&#x27;) + (so.size ? &#x27; (공급처 &#x27; + so.size + &#x27;) &#x27; : &#x27; &#x27;) + (sizeLine_(i) ? sizeLine_(i) + &#x27; (cm, 단면)&#x27; : &#x27;실측 미기재&#x27;);
  vals[7] = so.size || &#x27;&#x27;;
  vals[8] = (i.sale_colors || []).map(function (x) { return x.name + &#x27; / &#x27; + (i.sale_size || &#x27;FREE&#x27;); }).join(&#x27;, &#x27;);
  vals[9] = jFormula;
  vals[10] = d.cost.krw;
  vals[13] = true;
  vals[14] = memo;
  vals[17] = i.made ? &#x27;EEUN MADE&#x27; : &#x27;EEUN&#x27;;
  vals[19] = &#x27;=HYPERLINK(&quot;&#x27; + url + &#x27;&quot;,&quot;제품 자료&quot;)&#x27;;
  vals[20] = desc.replace(/\n/g, &#x27;&lt;br&gt;&#x27;);
  vals[21] = (i.sale_size || &#x27;FREE&#x27;) + &#x27;: &#x27; + (sizeLine_(i) || &#x27;상세 실측 확인 필요&#x27;) + &#x27;&lt;br&gt;cm / 단면&#x27;;
  vals[22] = i.material_customer || &#x27;&#x27;;
  vals[23] = desc;
  vals[24] = (i.sale_colors || []).map(function (x) { return i.product_name + &#x27; [&#x27; + (x.en || x.name).toUpperCase() + &#x27;]&#x27;; }).join(&#x27;\n&#x27;);
  vals[25] = pr.basis + &#x27;: &#x27; + pr.formula;
  vals[26] = [(i.unknowns || []).join(&#x27;, &#x27;), i.measurement_note || &#x27;&#x27;, &#x27;상품정보 TXT: &#x27; + txtUrl].filter(String).join(&#x27;\n&#x27;);
  if (vals[27] === &#x27;&#x27; || vals[27] === null) vals[27] = false;
  sh.getRange(row, 1, 1, 28).setValues([vals]);
  return row;
}

function writeJakji_(d) {
  var sh = SpreadsheetApp.openById(CFG.JAKJI_SHEET_ID).getSheetByName(CFG.JAKJI_TAB);
  var i = d.info;
  var last = lastRowInCol_(sh, 3);
  var names = sh.getRange(1, 3, Math.max(last, 1), 1).getDisplayValues();
  var row = 0;
  for (var k = names.length - 1; k &gt;= 4; k--) if (names[k][0] === i.product_name) { row = k + 1; break; }
  var no;
  if (!row) { row = Math.max(last, 4) + 1; no = row - 4; } else { no = sh.getRange(row, 1).getValue(); }
  var labels = (i.labels || []);
  sh.getRange(row, 1, 1, 8).setValues([[
    no,
    &#x27;=HYPERLINK(&quot;&#x27; + d.folders.productUrl + &#x27;&quot;,&quot;제품 폴더&quot;)&#x27;,
    i.product_name,
    colorsKo_(i),
    i.sale_size || &#x27;FREE&#x27;,
    labels.map(function (l) { return l.label; }).filter(String).join(&#x27; / &#x27;) || &#x27;확인 필요&#x27;,
    labels.map(function (l) { return [l.position, l.memo].filter(String).join(&#x27; — &#x27;); }).filter(String).join(&#x27;\n&#x27;) || &#x27;부착 위치·방식 확인 필요&#x27;,
    &#x27;앱 자동 등록. 공급처 발주 &#x27; + [(i.supplier_option || {}).color, (i.supplier_option || {}).size].filter(String).join(&#x27; / &#x27;) + &#x27;. 부착 치수 미확정 시 확인 필요.&#x27;
  ]]);
  return row;
}
